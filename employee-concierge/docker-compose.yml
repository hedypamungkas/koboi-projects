# Northwind employee concierge -- cross-instance A2A: three koboi containers + one web UI.
# The front-door `concierge` (8009) calls the `peer-it` (8011) and `peer-facilities` (8012)
# peers over the compose private network via the builtin call_peer_agent tool.
#
# All three services build from the SAME image; KOBOI_CONFIG selects each one's config.
services:
  peer-it:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KOBOI_CONFIG: peer_it
    ports: ["8011:8000"]
    volumes: ["koboi-data-it:/data"]
    env_file: [.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  peer-facilities:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KOBOI_CONFIG: peer_facilities
    ports: ["8012:8000"]
    volumes: ["koboi-data-fac:/data"]
    env_file: [.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  concierge:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KOBOI_CONFIG: concierge
      PEER_IT_URL: "http://peer-it:8000"
      PEER_FACILITIES_URL: "http://peer-facilities:8000"
    ports: ["8009:8000"]
    volumes: ["koboi-data-concierge:/data"]
    env_file: [.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Wait for both peers to be genuinely healthy (not just started) so the
    # concierge's A2A verify succeeds on boot instead of marking peers uncallable
    # for the first few requests (the documented compose start-order race).
    depends_on:
      peer-it:
        condition: service_healthy
      peer-facilities:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    build: ./frontend
    ports: ["3009:80"]
    depends_on:
      concierge:
        condition: service_healthy

volumes:
  koboi-data-concierge:
  koboi-data-it:
  koboi-data-fac:
