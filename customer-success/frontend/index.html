<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account Health — Customer Success Observatory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d100f'/%3E%3Cpath d='M4 18l5-6 4 4 5-8 5 5 5-3' fill='none' stroke='%23b6f563' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --void: #0d100f;
    --surface: #151a18;
    --surface-2: #1c221f;
    --inset: #090c0b;
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.14);
    --text: #eaece7;
    --text-2: #98a199;
    --text-3: #59625c;
    --lime: #b6f563;
    --lime-dim: rgba(182,245,99,0.13);
    --coral: #ff7a59;
    --coral-dim: rgba(255,122,89,0.14);
    --amber: #f5b942;
    --amber-dim: rgba(245,185,66,0.14);
    --display: "Bricolage Grotesk", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--display);
    color: var(--text);
    background: var(--void);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 60% 0%, black 35%, transparent 90%);
    mask-image: radial-gradient(ellipse 80% 70% at 60% 0%, black 35%, transparent 90%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(60% 50% at 90% 0%, rgba(182,245,99,0.07), transparent 60%),
                radial-gradient(50% 45% at 0% 100%, rgba(255,122,89,0.06), transparent 60%);
  }

  header {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 20px 34px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .glyph { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); display: grid; place-items: center; }
  .glyph svg { width: 24px; height: 24px; }
  .brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .brand .sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); margin-top: 3px; }
  .head-right { display: flex; align-items: center; gap: 16px; }
  .monitor { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--lime); background: var(--lime-dim); border: 1px solid rgba(182,245,99,0.3); padding: 6px 12px; border-radius: 999px; }
  .monitor .d { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
  .session { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .session .conn-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); margin-right: 6px; transform: translateY(-1px); }
  .session .conn-dot.on { background: var(--lime); box-shadow: 0 0 6px var(--lime); }

  main { position: relative; z-index: 1; display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 81px); }

  /* accounts panel */
  #accounts { border-right: 1px solid var(--line); overflow-y: auto; padding: 22px 22px 28px; background: linear-gradient(180deg, rgba(255,255,255,0.012), transparent 300px); }
  #accounts h2 { margin: 0 0 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  #accounts h2 .cnt { font-family: var(--mono); color: var(--text-3); }
  .acct {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 15px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.16s, transform 0.1s, background 0.16s; position: relative; overflow: hidden;
  }
  .acct:hover { border-color: var(--line-2); transform: translateY(-1px); background: var(--surface-2); }
  .acct::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .acct[data-risk="low"]::before { background: var(--lime); }
  .acct[data-risk="medium"]::before { background: var(--amber); }
  .acct[data-risk="high"]::before { background: var(--coral); }
  .acct .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .acct .id { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: 0.04em; }
  .acct .name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
  .acct .meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); display: flex; justify-content: space-between; margin-bottom: 12px; }
  .meter { height: 5px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden; margin-bottom: 8px; }
  .meter > i { display: block; height: 100%; border-radius: 999px; }
  .acct[data-risk="low"] .meter > i { width: 22%; background: var(--lime); }
  .acct[data-risk="medium"] .meter > i { width: 58%; background: var(--amber); }
  .acct[data-risk="high"] .meter > i { width: 88%; background: var(--coral); box-shadow: 0 0 12px var(--coral); }
  .acct[data-risk="high"] .meter > i { animation: glow 2s infinite; }
  @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .acct .tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 999px; }
  .acct[data-risk="low"] .tag { color: var(--lime); background: var(--lime-dim); }
  .acct[data-risk="medium"] .tag { color: var(--amber); background: var(--amber-dim); }
  .acct[data-risk="high"] .tag { color: var(--coral); background: var(--coral-dim); }
  .acct .tag .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* chat */
  #col { display: flex; flex-direction: column; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 26px 36px 8px; display: flex; flex-direction: column; gap: 4px; }
  #chat:empty::before { content: "Pick an account to read its vitals, or ask the analyst to score churn risk or draft outreach."; color: var(--text-3); font-size: 14px; margin: auto; max-width: 380px; text-align: center; line-height: 1.6; }
  .m { margin-bottom: 16px; max-width: 76%; animation: rise 0.28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .m .who { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
  .m .body { font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .m.user { margin-left: auto; }
  .m.user .who { text-align: right; color: var(--lime); }
  .m.user .body { background: var(--lime); color: #0d100f; font-weight: 600; padding: 11px 16px; border-radius: 16px 16px 4px 16px; white-space: normal; }
  .m.agent .who { color: var(--text-2); }
  .m.agent .body { background: var(--surface); border: 1px solid var(--line); padding: 13px 16px; border-radius: 16px 16px 16px 4px; }
  .m.agent.thinking .body { font-family: var(--mono); font-size: 13px; color: var(--text-3); }
  .m.agent.thinking .body .d { animation: blink 1.2s infinite; }
  .m.agent.thinking .body .d:nth-child(2){animation-delay:.15s}.m.agent.thinking .body .d:nth-child(3){animation-delay:.3s}
  @keyframes blink { 0%,60%,100%{opacity:.3} 30%{opacity:1} }
  .m.tool { max-width: 90%; }
  .m.tool .body { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); background: var(--inset); border: 1px solid var(--line); padding: 8px 12px; border-radius: 10px; }
  .m.tool .body.call { color: var(--lime); border-color: rgba(182,245,99,0.25); }
  .m.error .body { font-family: var(--mono); font-size: 12px; color: var(--coral); border: 1px solid rgba(255,122,89,0.4); background: var(--coral-dim); padding: 8px 12px; border-radius: 10px; }

  /* vitals readout (parsed JSON answer) */
  .readout { max-width: 86%; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; animation: rise 0.3s ease both; }
  .readout .rh { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .readout .score { font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 0.9; letter-spacing: -0.03em; }
  .readout .score small { font-size: 16px; color: var(--text-3); font-weight: 500; }
  .readout[data-risk="high"] .score { color: var(--coral); }
  .readout[data-risk="medium"] .score { color: var(--amber); }
  .readout[data-risk="low"] .score { color: var(--lime); }
  .readout .right { text-align: right; }
  .readout .lvl { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 999px; display: inline-block; }
  .readout[data-risk="high"] .lvl { color: var(--coral); background: var(--coral-dim); }
  .readout[data-risk="medium"] .lvl { color: var(--amber); background: var(--amber-dim); }
  .readout[data-risk="low"] .lvl { color: var(--lime); background: var(--lime-dim); }
  .readout .act { font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-top: 6px; }
  .readout .act b { color: var(--text); font-weight: 600; }
  .readout .why { font-size: 14px; line-height: 1.55; color: var(--text-2); border-top: 1px solid var(--line); padding-top: 12px; }

  /* approval = authorization slab */
  .auth { max-width: 86%; margin: 4px 0 18px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; overflow: hidden; animation: rise 0.3s ease both; }
  .auth__head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, var(--lime-dim), transparent); }
  .auth__head .seal { width: 26px; height: 26px; border-radius: 7px; background: var(--lime); color: #0d100f; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .auth__head .t { font-weight: 600; font-size: 15px; }
  .auth__head .t small { display: block; font-family: var(--mono); font-size: 10px; color: var(--text-3); font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
  .auth__body { padding: 14px 18px; }
  .auth__body .kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; font-family: var(--mono); font-size: 12px; }
  .auth__body .k { color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; padding-top: 2px; }
  .auth__body .v { color: var(--text); word-break: break-word; }
  .auth__actions { display: flex; border-top: 1px solid var(--line); }
  .auth__actions button { flex: 1; border: none; background: transparent; cursor: pointer; font-family: var(--display); font-size: 15px; font-weight: 600; padding: 13px; transition: background 0.14s; }
  .auth__actions .ok { color: var(--lime); }
  .auth__actions .ok:hover { background: var(--lime); color: #0d100f; }
  .auth__actions .no { color: var(--text-2); border-left: 1px solid var(--line); }
  .auth__actions .no:hover { background: var(--coral-dim); color: var(--coral); }
  .auth__actions button:disabled { opacity: 0.4; cursor: default; }

  /* composer */
  #composer { border-top: 1px solid var(--line); padding: 16px 36px 22px; background: rgba(255,255,255,0.015); }
  .crow { display: flex; gap: 12px; }
  .crow input { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; color: var(--text); font-family: var(--display); font-size: 15px; outline: none; transition: border-color 0.14s; }
  .crow input:focus { border-color: rgba(182,245,99,0.4); }
  .crow input::placeholder { color: var(--text-3); }
  .send { background: var(--lime); color: #0d100f; border: none; border-radius: 12px; padding: 0 24px; font-family: var(--display); font-weight: 700; font-size: 15px; cursor: pointer; transition: filter 0.14s, transform 0.1s; }
  .send:hover { filter: brightness(1.08); }
  .send:active { transform: scale(0.97); }
  .hint { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--text-3); margin-top: 10px; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 2px solid var(--void); }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; height: auto; }
    #accounts { max-height: 36vh; border-right: none; border-bottom: 1px solid var(--line); }
    header { padding: 16px 20px; }
    #chat, #composer { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="glyph"><svg viewBox="0 0 24 24" fill="none"><path d="M3 15l4-5 3 3 4-7 3 4 4-2" stroke="#b6f563" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
    <div>
      <h1>Account Health</h1>
      <div class="sub">Customer Success · Renewal observatory</div>
    </div>
  </div>
  <div class="head-right">
    <span class="monitor"><span class="d"></span>monitoring</span>
    <span class="session"><span class="conn-dot" id="conn-dot"></span><span id="session-id">no signal</span></span>
  </div>
</header>
<main>
  <section id="accounts">
    <h2>Book of Accounts <span class="cnt" id="acct-count"></span></h2>
    <div id="acct-list"></div>
  </section>
  <section id="col">
    <div id="chat"></div>
    <form id="composer">
      <div class="crow">
        <input id="message" type="text" placeholder="Score churn risk for an account, or draft outreach…" autocomplete="off" />
        <button type="submit" class="send">Analyze</button>
      </div>
      <div class="hint">Outreach drafts pause for your authorization · risk readouts are consensus-voted</div>
    </form>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
