<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customer Success -- Account Health</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1410'/%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='none' stroke='%2335d999' stroke-width='1.5'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='%2335d999' text-anchor='middle'%3ECS%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    --void: #07100c; --surface: #0f1814; --surface-raised: #142019; --surface-inset: #0a120e;
    --border-subtle: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.11); --border-strong: rgba(255,255,255,0.2);
    --text-primary: #ecf5f0; --text-secondary: #8aa399; --text-tertiary: #566b62;
    --green: #35d999; --green-dim: rgba(53,217,153,0.13); --green-border: rgba(53,217,153,0.4);
    --blue: #5b8cff; --blue-dim: rgba(91,140,255,0.14);
    --red: #ff6b6b; --red-dim: rgba(255,107,107,0.13); --red-border: rgba(255,107,107,0.42);
    --amber: #f5b942; --amber-dim: rgba(245,185,66,0.14); --amber-border: rgba(245,185,66,0.45);
    --font-sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius-sm: 6px; --radius-md: 10px;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--green-dim); color: var(--text-primary); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font-sans); background: var(--void); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; position: relative; font-size: 14px; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 2px; z-index: 5; background: linear-gradient(90deg, var(--green), var(--blue) 60%, var(--amber)); opacity: 0.5; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 28px 28px; -webkit-mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, black 30%, transparent 90%); mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, black 30%, transparent 90%); }
  header { position: relative; z-index: 1; padding: 14px 22px; border-bottom: 1px solid var(--border-subtle); background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand__mark { font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--green); background: var(--green-dim); border: 1px solid var(--green-border); border-radius: var(--radius-sm); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand__text h1 { font-size: 14.5px; margin: 0; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  .brand__org { display: block; font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .mode-pill { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--green); background: var(--green-dim); border: 1px solid var(--green-border); border-radius: 999px; padding: 4px 10px; }
  .conn { display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-tertiary); }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); flex-shrink: 0; }
  .conn-dot.active { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); animation: pulse-dot 2.4s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 3px var(--green-dim); } 50% { box-shadow: 0 0 0 5px transparent; } }
  main { flex: 1; display: flex; overflow: hidden; position: relative; z-index: 1; }
  #accounts { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border-subtle); overflow-y: auto; padding: 18px 16px; background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent 200px); }
  .accounts-head h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); margin: 0; font-weight: 700; }
  .accounts-sub { display: block; font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; margin-bottom: 14px; }
  .acct-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--text-tertiary); border-radius: var(--radius-md); padding: 11px 13px; margin-bottom: 9px; cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease; }
  .acct-card:hover { border-color: var(--border-strong); background: var(--surface-raised); transform: translateY(-1px); }
  .acct-card[data-risk="low"] { border-left-color: var(--green); }
  .acct-card[data-risk="medium"] { border-left-color: var(--amber); }
  .acct-card[data-risk="high"] { border-left-color: var(--red); }
  .acct-card__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .acct-id { font-family: var(--font-mono); font-weight: 600; font-size: 12px; }
  .risk-pill { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2.5px 7px; border-radius: 999px; }
  .risk-pill--low { background: var(--green-dim); color: var(--green); }
  .risk-pill--medium { background: var(--amber-dim); color: var(--amber); }
  .risk-pill--high { background: var(--red-dim); color: var(--red); }
  .acct-card__name { font-size: 13px; color: var(--text-primary); font-weight: 500; margin-bottom: 3px; }
  .acct-card__meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; }
  #chat:empty::before { content: "Pick an account, or ask the analyst to score churn risk or draft outreach."; margin: auto; max-width: 360px; text-align: center; color: var(--text-tertiary); font-size: 13px; line-height: 1.6; }
  .msg { margin-bottom: 16px; max-width: 80%; animation: msg-in 0.22s ease both; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { margin-left: auto; text-align: right; }
  .msg.tool, .msg.error { max-width: 92%; }
  .msg-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; color: var(--text-tertiary); margin-bottom: 4px; }
  .msg.user .msg-label { text-align: right; }
  .msg .bubble { display: inline-block; padding: 9px 13px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.55; white-space: pre-wrap; text-align: left; word-break: break-word; }
  .msg.user .bubble { background: var(--green); color: #04180f; font-weight: 500; border-bottom-right-radius: 3px; }
  .msg.agent .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.agent.thinking .bubble { display: inline-flex; align-items: center; gap: 4px; padding: 12px 14px; }
  .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary); animation: typing-bounce 1.2s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; } .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce { 0%,60%,100% { opacity: 0.35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  .msg.tool .bubble { background: var(--surface-inset); border: 1px dashed var(--border); color: var(--text-secondary); font-family: var(--font-mono); font-size: 12px; border-radius: var(--radius-sm); }
  .msg.tool .bubble.tool-call { color: var(--green); border-color: rgba(53,217,153,0.3); }
  .msg.tool .bubble.tool-result { color: var(--text-secondary); }
  .msg.error .bubble { background: var(--red-dim); border: 1px solid var(--red-border); color: #ffb4b4; border-radius: var(--radius-sm); }
  .approval-card { border: 1px solid var(--amber-border); border-left: 3px solid var(--amber); background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; margin: 4px 0 16px; font-size: 13px; max-width: 92%; animation: msg-in 0.22s ease both; }
  .approval-card.risk-moderate { border-left-color: var(--amber); border-color: var(--amber-border); }
  .approval-card__head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .approval-card__icon { font-size: 13px; width: 24px; height: 24px; border-radius: 50%; background: var(--amber-dim); color: var(--amber); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .approval-card .title { font-weight: 700; color: var(--text-primary); font-size: 13.5px; }
  .risk-pill-tag { display: inline-block; margin-top: 4px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 999px; background: var(--amber-dim); color: var(--amber); }
  .approval-card__body { background: var(--surface-inset); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; }
  .approval-card pre { margin: 0; font-size: 12px; font-family: var(--font-mono); white-space: pre-wrap; word-break: break-word; color: var(--text-primary); }
  .kv-grid { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-family: var(--font-mono); font-size: 12px; }
  .kv-key { color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; font-size: 10.5px; padding-top: 1px; }
  .kv-val { color: var(--text-primary); word-break: break-word; }
  .approval-card__actions { display: flex; gap: 8px; }
  .approval-card button { border: none; border-radius: var(--radius-sm); padding: 7px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--font-sans); transition: filter 0.12s ease, transform 0.08s ease; }
  .approval-card button:hover { filter: brightness(1.12); } .approval-card button:active { transform: translateY(1px); } .approval-card button:disabled { opacity: 0.5; cursor: default; filter: none; transform: none; }
  .approve-btn { background: var(--green); color: #04180f; }
  .reject-btn { background: transparent; color: var(--red); border: 1px solid var(--red-border) !important; }
  #composer { border-top: 1px solid var(--border-subtle); padding: 14px 24px 16px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; background: linear-gradient(0deg, rgba(255,255,255,0.015), transparent); }
  .composer-row { display: flex; gap: 10px; min-width: 0; }
  #composer input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 11px 14px; color: var(--text-primary); font-size: 14px; font-family: var(--font-sans); transition: border-color 0.15s ease; }
  #composer input:focus { border-color: var(--green-border); outline: none; }
  #composer input::placeholder { color: var(--text-tertiary); }
  #composer button.send { background: var(--green); color: #04180f; border: none; border-radius: var(--radius-md); padding: 10px 20px; font-size: 13.5px; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: filter 0.12s ease, transform 0.08s ease; }
  #composer button.send:hover { filter: brightness(1.1); }
  .composer-hint { font-size: 10.5px; color: var(--text-tertiary); padding-left: 2px; }
  .composer-hint kbd { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-size: 10px; }
  @media (max-width: 760px) { main { flex-direction: column; } #accounts { width: 100%; max-height: 220px; border-right: none; border-bottom: 1px solid var(--border-subtle); } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand__mark">CS</span>
    <div class="brand__text">
      <h1>Account Health</h1>
      <span class="brand__org">Customer Success &middot; Churn-risk &amp; Renewal</span>
    </div>
  </div>
  <div class="header-right">
    <span class="mode-pill">SINGLE-AGENT</span>
    <span class="conn"><span class="conn-dot" id="conn-dot"></span><span id="session-id" class="sub">no session</span></span>
  </div>
</header>
<main>
  <section id="accounts">
    <div class="accounts-head">
      <h2>Accounts</h2>
      <span class="accounts-sub">Click to assess</span>
    </div>
    <div id="acct-list"></div>
  </section>
  <section id="chat-col">
    <div id="chat"></div>
    <form id="composer">
      <div class="composer-row">
        <input id="message" type="text" placeholder="Score churn risk for ACC-7702, or draft outreach..." autocomplete="off" />
        <button type="submit" class="send">Send</button>
      </div>
      <span class="composer-hint">Outreach drafts pause for your approval; risk answers are consensus-voted &middot; <kbd>Enter</kbd> to send</span>
    </form>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
