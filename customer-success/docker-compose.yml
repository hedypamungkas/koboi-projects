# SaaS customer-success -- one koboi container (single-agent) + web UI.
# API on host 8010, web on 3010.
services:
  koboi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8010:8000"]
    volumes: ["koboi-data:/data"]
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
  web:
    build: ./frontend
    ports: ["3010:80"]
    depends_on:
      koboi:
        condition: service_healthy

volumes:
  koboi-data:
