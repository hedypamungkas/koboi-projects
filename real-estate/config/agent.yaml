agent:
  name: "realestate-assistant"
  # `mode: act` is the config-level default applied whenever a request omits `mode`. The buyer-chat
  # frontend's `streamChat` call always omits it, and so would a real production nightly-cron's job
  # payload -- this repo's demo "Run nightly batch now" button is the one exception, since it
  # explicitly passes `mode: "act"` in its `POST /v1/jobs` body (see frontend/app.js), which is
  # harmless here only because it matches this config default anyway. This matters because
  # koboi/hooks/mode_hook.py's ModeHook hard-blocks (denies, not just discourages) any tool whose
  # name isn't in a small hardcoded read-only allowlist ("read", "search", "web_search", ... plus
  # `delegate_tasks`) whenever the *runtime* mode is CHAT or PLAN -- and that allowlist has no way
  # to know about our custom tools. Left at the pydantic default `mode: chat`, ModeHook blocks
  # even `lookup_property` (SAFE) with "CHAT mode: tool 'lookup_property' is not allowed",
  # confirmed by running this exact config. `act` lifts that block for every tool while keeping
  # the two safety mechanisms that actually matter here: DESTRUCTIVE tools still pause for human
  # approval (docs/00 SS5) -- moot here since our riskiest tools are MODERATE -- and MODERATE tools
  # never publish/send by construction (see src/realestate_ext/tools.py), so there's nothing unsafe
  # about the buyer widget being able to reach draft_* too. `server.allowed_modes` below is what
  # still lets the buyer widget request an explicit `mode: "chat"` per-turn if ever needed.
  mode: act
  system_prompt: |
    You serve two different callers through the same tools -- always work out which one you're
    talking to and follow that caller's rules exactly; never blend the two.

    BUYER CHAT (a live buyer asking questions on the listings site): only ever use lookup_property
    to answer their questions about price, availability, and amenities. NEVER call
    draft_listing_description or draft_followup_email in a buyer chat -- not even for a single
    property, and not even if the buyer directly and explicitly asks you to draft or rewrite a
    description or email. There is no human approver watching a buyer chat session, so a draft tool
    call there will simply stall and then be auto-denied. If a buyer asks for a fresh description, a
    rewrite, or a follow-up email, do not call either drafting tool -- explain that descriptions and
    follow-ups are handled by the team, not live in chat, and offer to answer their property
    questions with lookup_property instead.

    NIGHTLY JOB (an unattended automated batch run): this is the ONLY context where
    draft_listing_description and draft_followup_email may ever be called. Draft listing
    descriptions and lead follow-up emails as requested.

    Whenever a nightly job request covers 2 or more properties/leads needing drafts, you MUST call
    delegate_tasks with one sub-task per item -- do NOT call draft_listing_description or
    draft_followup_email yourself for a batch, whether sequentially or as several tool calls in the
    same turn. Only call those two tools directly when a nightly job asks you to draft a single,
    standalone item. Each delegate_tasks sub-task should tell the sub-agent exactly which tool to
    call and with which ID -- e.g. "Call draft_listing_description with property_id=P-101" or "Call
    draft_followup_email with lead_id=L-002". delegate_tasks accepts at most 10 items per call, so
    split a larger batch into multiple delegate_tasks calls.

    A real nightly-cron caller already knows which property/lead IDs need drafts (it just queried
    the CRM for them) and should name them explicitly in its job message. If a nightly job request
    instead refers to items only by description ("the new properties", "the stale lead") without
    giving IDs, resolve them against tonight's batch: the new listings awaiting description drafts
    are P-101, P-102, and P-103 (P-104 already has copy), and the stale lead needing a follow-up is
    L-002.

    Never publish a listing or send an email yourself -- your drafts always go to a human for
    review before anything is published or sent.

llm:
  provider: "openai"
  model: "${OPENAI_MODEL}"
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL:}"

tools:
  # delegate_tasks is a built-in tool, but koboi only registers ANY builtin tool
  # when `tools.builtin` is non-empty (see koboi/facade.py:_build_tools) -- an
  # empty/absent list means no builtin tools at all, not "all of them". Listing
  # it here is what actually turns it on; it also acts as an allowlist so we
  # don't pull in unrelated builtins (shell, filesystem, etc.) we don't need.
  builtin: [delegate_tasks]
  custom:
    - module: realestate_ext.tools

memory:
  backend: sqlite
  db_path: /data/koboi_memory.db

# Autonomous jobs refuse to run on the default `passthrough` sandbox backend --
# koboi/server/jobs.py's _execute_job hard-refuses with PermissionError unless
# sandbox.backend is 'restricted' (verified by running the nightly-batch job
# against this config). None of our tools shell out or touch the filesystem,
# but jobs mode requires this regardless.
sandbox:
  backend: restricted
  workdir: /data/workspace
  # NOTE: `workdir_strategy: per_session` was removed in koboi-agent 0.18.x
  # (commit 1c25749 "remove dead fields"). Per-session workdir isolation is now
  # automatic -- koboi/server/pool.py:AgentPool._build_agent derives a per-session
  # workdir (workspace_root/<session_id>) and overrides `sandbox.workdir` at agent
  # build time, so the strategy knob became dead config and the SandboxConfig
  # schema now rejects unknown keys (would crash `koboi serve` at startup).
  network: deny

jobs:
  enabled: true
  max_concurrent: 5
  # koboi 0.18+ knobs: resume_on_startup defaults to true (an interrupted nightly
  # batch resumes instead of being lost on a container restart); timeout_seconds
  # caps a single nightly batch's wall clock -- the delegate_tasks fan-out over
  # several listings can run a while, so leave the roomy default.
  resume_on_startup: true
  timeout_seconds: 1800

server:
  enabled: true
  auth_required: false   # simplified for this local smoke-test POC -- would be `true` (with issued
                          # API keys, see docs/00 §4) in production
  allowed_modes: [chat, act]
  cors:
    allow_origins: ["*"]  # POC only -- lock to the listings-site origin in production
    # frontend/app.js reads the X-Session-Id response header (needed to auto-deny
    # pending_approval events, see app.js's streamChat/chatForm) -- CORS hides
    # response headers from cross-origin JS by default unless explicitly exposed.
    expose_headers: ["X-Session-Id"]
  limits:
    max_iterations_cap: 15
