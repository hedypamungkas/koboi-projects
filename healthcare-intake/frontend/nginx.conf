# Demo frontends are served by nginx:alpine. Override the default server so the
# browser always revalidates static assets (Cache-Control: no-cache) instead of
# reusing a stale app.js across a web-container rebuild. "no-cache" still allows
# cheap 304 revalidation (ETag/If-None-Match) -- it just forbids serving a stale
# copy without checking, so a rebuilt app.js is picked up on the next reload.
server {
    listen 80;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    location / {
        index index.html;
    }
}
