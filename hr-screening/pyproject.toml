[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-ext"
version = "0.1.0"
description = "Northstar Talent resume-screening extensions for koboi-agent (tools + audit hook + server entrypoint)"
requires-python = ">=3.10"
dependencies = [
    "uvicorn[standard]>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
