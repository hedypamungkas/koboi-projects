services:
  koboi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8005:8000"]
    volumes: ["koboi-data:/data", "./playbook_skills:/app/playbook_skills:ro"]
    env_file: [.env]
  web:
    build: ./frontend
    ports: ["3005:80"]
    depends_on: [koboi]
volumes:
  koboi-data:
