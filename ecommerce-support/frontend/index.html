<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anvil &amp; Co Support</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #2f3e2f;
      --brand-light: #e8ebe4;
      --accent: #b5551d;
      --bg: #faf8f5;
      --bubble-user: #2f3e2f;
      --bubble-agent: #ffffff;
      --border: #d8d3c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #22261f;
    }
    header {
      background: var(--brand);
      color: #fff;
      padding: 1rem 1.5rem;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header p { margin: 0.15rem 0 0; font-size: 0.8rem; opacity: 0.75; }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1.25rem;
    }
    section.panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    section.panel > h2 {
      margin: 0;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      background: var(--brand-light);
      border-bottom: 1px solid var(--border);
    }
    #chat-log {
      height: 360px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .bubble {
      max-width: 80%;
      padding: 0.55rem 0.8rem;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .bubble.agent {
      align-self: flex-start;
      background: var(--bubble-agent);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }
    .bubble.status {
      align-self: flex-start;
      background: transparent;
      color: #7a7568;
      font-style: italic;
      font-size: 0.82rem;
      padding: 0.1rem 0.2rem;
    }
    .bubble.error {
      align-self: stretch;
      background: #fbeaea;
      color: #8a2c2c;
      border: 1px solid #e3b5b5;
    }
    form#chat-form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem;
      border-top: 1px solid var(--border);
    }
    #chat-input {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
    }
    #chat-form button { background: var(--accent); color: #fff; }
    #chat-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    #approvals-list { padding: 0.75rem 1rem; display: grid; gap: 0.6rem; min-height: 3rem; }
    #approvals-list:empty::after {
      content: "No refunds waiting for review.";
      color: #948f81;
      font-size: 0.85rem;
    }
    .approval-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.88rem;
    }
    .approval-card .buttons { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .approval-card button.approve { background: #3c6e3c; color: #fff; }
    .approval-card button.reject { background: #a33b3b; color: #fff; }
    footer { text-align: center; color: #948f81; font-size: 0.75rem; padding-bottom: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Anvil &amp; Co Support</h1>
    <p>Ask about an order, a return, or our shipping policy.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Storefront chat</h2>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" autocomplete="off"
               placeholder="e.g. Where is my order #10234 and can I return it?" />
        <button type="submit">Send</button>
      </form>
    </section>

    <section class="panel">
      <h2>Internal: pending refund approvals</h2>
      <div id="approvals-list"></div>
    </section>
  </main>

  <footer>Demo build -- auth_required is disabled for local smoke testing only.</footer>

  <script src="app.js"></script>
</body>
</html>
