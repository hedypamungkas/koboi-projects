<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ledgerline Manufacturing -- Invoice Reconciliation</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e8eb; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid #2a2e37; display: flex;
    align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: #8b93a1; font-size: 12px; }
  main { flex: 1; display: flex; overflow: hidden; }
  #invoices {
    width: 340px; border-right: 1px solid #2a2e37; overflow-y: auto; padding: 12px;
  }
  #invoices h2 { font-size: 13px; text-transform: uppercase; color: #8b93a1; margin: 4px 0 12px; }
  .invoice-card {
    background: #171a21; border: 1px solid #2a2e37; border-radius: 8px; padding: 10px 12px;
    margin-bottom: 10px; cursor: pointer;
  }
  .invoice-card:hover { border-color: #4b5563; }
  .invoice-card .row { display: flex; justify-content: space-between; font-size: 13px; }
  .invoice-card .vendor { color: #8b93a1; font-size: 12px; margin-top: 2px; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
  .badge.matched { background: #143a24; color: #4ade80; }
  .badge.flagged { background: #3a1414; color: #f87171; }
  #chat-col { flex: 1; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .msg { margin-bottom: 14px; max-width: 80%; }
  .msg.user { margin-left: auto; text-align: right; }
  .msg .bubble {
    display: inline-block; padding: 8px 12px; border-radius: 10px; font-size: 14px;
    white-space: pre-wrap; text-align: left;
  }
  .msg.user .bubble { background: #2563eb; color: white; }
  .msg.agent .bubble { background: #171a21; border: 1px solid #2a2e37; }
  .msg.tool .bubble { background: #171a21; border: 1px dashed #4b5563; color: #8b93a1; font-size: 12px; }
  .msg.error .bubble { background: #3a1414; border: 1px solid #7f1d1d; color: #fca5a5; }
  .approval-card {
    border: 1px solid #a16207; background: #2b2308; border-radius: 8px; padding: 12px;
    margin: 8px 0; font-size: 13px;
  }
  .approval-card .title { font-weight: 600; color: #facc15; margin-bottom: 6px; }
  .approval-card pre { margin: 6px 0; font-size: 12px; white-space: pre-wrap; color: #e6e8eb; }
  .approval-card button {
    margin-top: 8px; margin-right: 8px; border: none; border-radius: 6px; padding: 6px 14px;
    font-size: 13px; cursor: pointer;
  }
  .approve-btn { background: #16a34a; color: white; }
  .reject-btn { background: #dc2626; color: white; }
  #composer { border-top: 1px solid #2a2e37; padding: 12px 20px; display: flex; gap: 8px; }
  #composer input {
    flex: 1; background: #171a21; border: 1px solid #2a2e37; border-radius: 8px;
    padding: 10px 12px; color: #e6e8eb; font-size: 14px;
  }
  #composer button {
    background: #2563eb; color: white; border: none; border-radius: 8px; padding: 10px 18px;
    font-size: 14px; cursor: pointer;
  }
  #session-id { font-size: 11px; color: #6b7280; }
</style>
</head>
<body>
<header>
  <h1>Ledgerline Manufacturing &mdash; Invoice Reconciliation</h1>
  <span id="session-id" class="sub">no session yet</span>
</header>
<main>
  <section id="invoices">
    <h2>Flagged by last night's job</h2>
    <div id="invoice-list"></div>
  </section>
  <section id="chat-col">
    <div id="chat"></div>
    <form id="composer">
      <input id="message" type="text" placeholder="Ask about a flagged invoice, or say 'post that entry'..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
